<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="津高技専用AI学校アシスタント LumiA" />
    <meta name="theme-color" content="#f6e9cf" />

    <title>ホーム | LumiA</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/icons/favicon_master.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/images/icons/favicon_master.png"
    />

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/home.css" />

    <script src="../js/home.js" defer></script>
  </head>

  <body class="home-page">
    <main class="home-screen">
      <!-- 本の背景 -->
      <div class="home-screen__background" aria-hidden="true"></div>

      <div class="home-book">
        <!-- 左ページ：LumiAの紹介 -->
        <section class="home-book__left" aria-label="LumiAの紹介">
          <div class="home-intro">
            <div class="home-intro__content">
              <!-- LumiAロゴ -->
              <img
                class="home-logo"
                src="../assets/images/icons/logo_main.png"
                alt="LumiA"
              />

              <!-- キャッチコピー -->
              <h1 class="home-intro__headline">
                知りたいことを、<br />
                ここから。
              </h1>

              <!-- 紹介文 -->
              <p class="home-intro__description">
                授業・資格・学校生活のこと。<br />
                津高技専のことなら、<br />
                LumiAに聞いてみよう。
              </p>
            </div>

            <!-- コーギくん -->
            <img
              class="home-intro__mascot"
              src="../assets/images/characters/corgi_idea.png"
              alt="ひらめいた表情のコーギくん"
            />
          </div>
        </section>

        <!-- 右ページ：質問エリア -->
        <section class="home-book__right" aria-label="LumiAへの質問">
          <div class="home-question">
            <div class="home-question__content">
              <!-- 質問入力フォーム -->
              <form class="home-question__form" id="home-question-form">
                <label class="home-question__label" for="home-question-input">
                  今日は何を知りたいですか？
                </label>

                <textarea
                  class="home-question__input"
                  id="home-question-input"
                  name="question"
                  rows="4"
                  placeholder="例：これから取得すると良い資格は？"
                  required
                ></textarea>

                <div class="home-question__actions">
                  <button class="home-question__submit" type="submit">
                    <span>質問する</span>
                    <span class="home-question__arrow" aria-hidden="true"
                      >→</span
                    >
                  </button>
                </div>
              </form>

              <!-- ページ装飾 -->
              <div class="home-question__footnote" aria-hidden="true"></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
