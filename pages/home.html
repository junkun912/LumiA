<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="津高技専用AI学校アシスタント LumiA" />
    <meta name="theme-color" content="#f6e9cf" />

    <title>ホーム | LumiA</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/icons/favicon_master.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/images/icons/favicon_master.png"
    />

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/home.css" />

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>
    <script src="../js/error-handler.js" defer></script>

    <!-- ホーム画面専用JavaScript -->
    <script type="module" src="../js/home.js"></script>
  </head>

  <body class="home-page">
    <main class="home-screen">
      <!-- 本の背景 -->
      <div class="home-screen__background" aria-hidden="true"></div>

      <div class="home-book">
        <!-- 左ページ：LumiAの紹介 -->
        <section class="home-book__left" aria-label="LumiAの紹介">
          <div class="home-intro">
            <div class="home-intro__content">
              <!-- LumiAロゴ -->
              <img
                class="home-logo"
                src="../assets/images/icons/logo_main.png"
                alt="LumiA"
              />

              <!-- キャッチコピー -->
              <h1 class="home-intro__headline">
                知りたいことを、<br />
                ここから。
              </h1>

              <!-- 紹介文 -->
              <p class="home-intro__description">
                授業・資格・学校生活のこと。<br />
                津高技専のことなら、<br />
                LumiAに聞いてみよう。
              </p>
            </div>

            <!-- コーギくん -->
            <img
              class="home-intro__mascot"
              src="../assets/images/characters/corgi_idea.png"
              alt="ひらめいた表情のコーギくん"
            />
          </div>
        </section>

        <!-- 右ページ：質問エリア -->
        <section class="home-book__right" aria-label="LumiAへの質問">
          <div class="home-question">
            <div class="home-question__content">
              <!-- 質問入力フォーム -->
              <form class="home-question__form" id="home-question-form">
                <label class="home-question__label" for="home-question-input">
                  今日は何を知りたいですか？
                </label>

                <textarea
                  class="home-question__input"
                  id="home-question-input"
                  name="question"
                  rows="4"
                  placeholder="例：これから取得すると良い資格は？"
                  required
                ></textarea>

                <!-- ボタンエリア -->
                <div class="home-question__actions">
                  <!-- 質問する -->
                  <button class="home-question__submit" type="submit">
                    <span>質問する</span>
                    <span class="home-question__arrow" aria-hidden="true"
                      >→</span
                    >
                  </button>

                  <!-- よくある質問 -->
                  <a class="home-question__faq-link" href="./faq.html">
                    <svg
                      class="home-question__faq-icon"
                      viewBox="0 0 24 24"
                      fill="none"
                      aria-hidden="true"
                    >
                      <path
                        d="M12 7.5C9.2 5.5 5.8 5.5 3 6.5V19C6.2 18 9.3 18.5 12 20C14.7 18.5 17.8 18 21 19V6.5C18.2 5.5 14.8 5.5 12 7.5Z"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linejoin="round"
                      />
                      <path
                        d="M12 7.5V20M6.5 10L9.5 10.5M14.5 10.5L17.5 10"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                      />
                      <path
                        d="M19 2L19.8 4.2L22 5L19.8 5.8L19 8L18.2 5.8L16 5L18.2 4.2Z"
                        fill="#E99A43"
                      />
                    </svg>

                    <span>よくある質問を見る</span>
                    <span class="home-question__faq-arrow" aria-hidden="true"
                      >→</span
                    >
                  </a>
                </div>
              </form>

              <!-- 個人情報に関する注意 -->
              <p class="home-question__footnote">
                ※氏名・住所・電話番号などの個人情報は入力しないでください。
              </p>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
