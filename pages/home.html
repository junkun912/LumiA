<!--
==================================================
LumiA
ファイル名：home.html

【ファイル概要】
LumiAのホーム画面。

【基本操作】
質問する → 回答を見る

【対象】
・学生
・指導員
・ゲスト

【主な役割】
・LumiAへの入口をつくる
・ユーザーが迷わず質問できるようにする
・LumiAの世界観を最初に伝える
・コーギくんを案内役として表示する
・質問とファイルを入力できるようにする

==================================================
-->

    <!-- =================================================
       メイン
    ================================================== -->

    <main class="home-main">
      <!-- =================================================
         背景
      ================================================== -->

      <div class="home-background" aria-hidden="true"></div>

      <!-- =================================================
         背景オーバーレイ
      ================================================== -->

      <div class="home-overlay" aria-hidden="true"></div>

      <!-- =================================================
         下部ウェーブ
      ================================================== -->

      <div class="home-wave" aria-hidden="true"></div>

      <!-- =================================================
         メインコンテンツ
      ================================================== -->

      <div class="home-content">
        <!-- =================================================
           ヒーロー
        ================================================== -->

        <section class="hero-section">
          <h1 class="hero-title">
            津高技の「知りたい」を<br />
            いつでもサポート
          </h1>

          <p class="hero-description">
            学校のこと、訓練のこと、資格のこと。<br />
            知りたいことをLumiAに質問してみてください。
          </p>
        </section>

        <!-- =================================================
           質問エリア
        ================================================== -->

        <section class="question-section" aria-label="LumiAへの質問">
          <!-- =================================================
             コーギくん
             質問欄の外側に配置
          ================================================== -->

          <div class="mascot-area">
            <div class="mascot-speech">
              <strong>なんでも聞いてね！</strong>
            </div>

            <img
              src="../assets/images/characters/corgi_basic.png"
              alt="LumiAの案内役 コーギくん"
              class="corgi-main"
            />
          </div>

          <!-- =================================================
             質問入力エリア
          ================================================== -->

          <div class="question-area">
            <form id="question-form" class="question-form">
              <!-- =================================================
                 質問入力ラベル
              ================================================== -->

              <label for="question-input" class="visually-hidden">
                質問を入力してください
              </label>

              <!-- =================================================
                 質問欄タイトル
              ================================================== -->

              <div class="question-heading">
                <span class="question-heading-label"> LumiAに質問する </span>
              </div>

              <!-- =================================================
                 質問入力
              ================================================== -->

              <textarea
                id="question-input"
                name="question"
                class="question-input"
                maxlength="1000"
                rows="6"
                placeholder="例：ICTエンジニア科では、どんな訓練がありますか？"
              ></textarea>

              <!-- =================================================
                 質問フォーム下部
              ================================================== -->

              <div class="question-form-bottom">
                <!-- =================================================
                   ファイル添付
                ================================================== -->

                <div class="file-upload-area">
                  <input
                    type="file"
                    id="file-input"
                    class="file-input"
                    accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg"
                  />

                  <label for="file-input" class="file-upload-button">
                    <span class="file-upload-icon" aria-hidden="true">
                      📎
                    </span>

                    <span>ファイルを添付</span>
                  </label>

                  <span
                    id="file-name"
                    class="file-name"
                    aria-live="polite"
                  ></span>
                </div>

                <!-- =================================================
                   Enter操作案内
                ================================================== -->

                <div class="question-form-note">
                  <span> Enterで送信 / Shift + Enterで改行 </span>
                </div>

                <!-- =================================================
                   質問ボタン
                ================================================== -->

                <button
                  type="submit"
                  id="question-submit"
                  class="question-submit"
                >
                  <span>質問する</span>

                  <span class="submit-arrow" aria-hidden="true"> → </span>
                </button>
              </div>
            </form>

            <!-- =================================================
               個人情報注意
            ================================================== -->

            <p class="privacy-notice">
              ※
              名前・電話番号・メールアドレス・住所・学生番号などの個人情報は入力しないでください。
            </p>
          </div>
        </section>

        <!-- =================================================
           ホーム画面内 著作権表記
           --------------------------------------------------
           独立した白いフッターにはせず、
           ホーム背景の中に自然に配置する。
        ================================================== -->

        <div class="home-credit">© 三重県立津高等技術学校｜LumiA</div>
