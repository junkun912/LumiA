<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="津高技専用AI学校アシスタント LumiA のログイン画面です。"
    />

    <title>ログイン | LumiA</title>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/login.css" />

    <script src="../js/login.js" defer></script>
  </head>

  <body class="login-page">
    <main class="login-screen">
      <!-- 背景画像：文字やロゴは画像に含めない -->
      <div class="login-screen__background" aria-hidden="true"></div>

      <div class="login-screen__overlay" aria-hidden="true"></div>

      <!-- 本の左右ページに合わせたコンテンツ -->
      <div class="login-book">
        <!-- ==============================
             左ページ：LumiAの紹介
        =============================== -->
        <section class="login-intro" aria-label="LumiAの紹介">
          <div class="login-intro__content">
            <!-- メインロゴ -->
            <a
              class="login-intro__logo"
              href="../index.html"
              aria-label="LumiA ホーム"
            >
              <img src="../assets/images/icons/logo_main.png" alt="LumiA" />
            </a>

            <!-- キャッチコピー -->
            <h1 class="login-intro__message">
              知りたいが、<br />
              学びに変わる。
            </h1>

            <!-- 装飾 -->
            <div class="login-intro__ornament" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>

            <!-- サービス説明 -->
            <p class="login-intro__description">
              学校での学びを、もっと身近に。<br />
              LumiAがあなたの学習をサポートします。
            </p>
          </div>

          <!-- コーギくん -->
          <div class="login-mascot">
            <img
              class="login-mascot__image"
              src="../assets/images/characters/corgi_basic.png"
              alt="LumiAの案内役、コーギくん"
            />

            <div class="login-mascot__message">
              <span class="login-mascot__message-text">
                コーギくんです！<br />
                よろしくね！
              </span>
            </div>
          </div>

          
        </section>

        <!-- ==============================
             右ページ：ログイン
        =============================== -->
        <section class="login-panel" aria-labelledby="login-title">
          <header class="login-panel__header">
            <p class="login-panel__eyebrow">WELCOME TO LumiA</p>

            <h2 class="login-panel__title" id="login-title">ログイン</h2>

            <div class="login-panel__ornament" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>

            <p class="login-panel__description">
              アカウント情報を入力してください。
            </p>
          </header>

          <!-- ログインフォーム -->
          <form class="login-form" id="login-form" novalidate>
            <!-- ユーザー名 -->
            <div class="login-form__field">
              <label class="login-form__label" for="username">
                ユーザー名
              </label>

              <div class="login-form__input-wrap">
                <span class="login-form__input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"></path>
                  </svg>
                </span>

                <input
                  class="login-form__input"
                  type="text"
                  id="username"
                  name="username"
                  placeholder="ユーザー名を入力"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <!-- パスワード -->
            <div class="login-form__field">
              <label class="login-form__label" for="password">
                パスワード
              </label>

              <div class="login-form__input-wrap">
                <span class="login-form__input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                    <path d="M12 14v3"></path>
                  </svg>
                </span>

                <input
                  class="login-form__input login-form__input--password"
                  type="password"
                  id="password"
                  name="password"
                  placeholder="パスワードを入力"
                  autocomplete="current-password"
                  required
                />

                <button
                  class="login-form__password-toggle"
                  type="button"
                  id="toggle-password"
                  aria-label="パスワードを表示"
                  aria-pressed="false"
                >
                  <svg
                    class="login-form__eye-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    aria-hidden="true"
                  >
                    <path
                      d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M3 3 21 21"></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- ログイン状態を保持 -->
            <label class="login-form__remember">
              <input type="checkbox" id="remember-me" name="remember" />

              <span class="login-form__checkbox"></span>

              <span>ログイン状態を保持する</span>
            </label>

            <!-- ログインボタン -->
            <button class="login-form__submit" type="submit">
              <span>ログイン</span>

              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 12h15"></path>
                <path d="m13 5 7 7-7 7"></path>
              </svg>
            </button>

            <!-- ログイン結果・エラー表示 -->
            <p
              class="login-form__status"
              id="login-status"
              role="status"
              aria-live="polite"
            ></p>

            <!-- パスワード再設定 -->
            <a class="login-form__forgot" href="./forgot-password.html">
              パスワードを忘れた方はこちら
              <span aria-hidden="true">›</span>
            </a>

            <!-- 区切り -->
            <div class="login-form__divider" aria-hidden="true">
              <span></span>
              <i></i>
              <span></span>
            </div>

            <!-- ゲスト利用 -->
            <a class="login-form__guest" href="./home.html">
              <span class="login-form__guest-star" aria-hidden="true">✦</span>

              <span>ログインせずにゲストとして利用する</span>

              <span class="login-form__guest-arrow" aria-hidden="true">›</span>
            </a>
          </form>

          
        </section>
      </div>
    </main>
  </body>
</html>
