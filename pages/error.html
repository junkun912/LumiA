<!--
==================================================
LumiA
ファイル名：error.html

【ファイル概要】
LumiAでエラーが発生した場合に表示するHTMLファイル。

【主な役割】
・エラー内容をユーザーに分かりやすく表示する
・エラーの種類に応じて案内内容を切り替える
・再試行などの操作を提供する
・ホーム画面への移動を案内する

【関連ファイル】
・css/common.css
・css/error.css
・js/common.js
・js/error-handler.js
・js/error.js

【注意】
AWSやシステム内部の詳細なエラー情報を
そのままユーザーに表示しない。
==================================================
-->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="LumiAでエラーが発生した際の案内ページです。"
    />

    <meta name="robots" content="noindex, nofollow" />

    <meta name="theme-color" content="#f5e6c9" />

    <title>エラーが発生しました｜LumiA</title>

    <!-- ==================================================
         CSS
    ================================================== -->

    <!-- 共通CSS -->
    <link rel="stylesheet" href="../css/common.css" />

    <!-- エラー画面専用CSS -->
    <link rel="stylesheet" href="../css/error.css" />

    <!-- ==================================================
         JavaScript
    ================================================== -->

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>

    <!-- 共通エラーハンドラー -->
    <script src="../js/error-handler.js" defer></script>

    <!-- エラー画面専用JavaScript -->
    <script src="../js/error.js" defer></script>
  </head>

  <body class="error-page">
    <!-- ==================================================
         メインコンテンツ
    ================================================== -->

    <main class="error-main">
      <section
        class="error-content"
        aria-labelledby="error-title"
        aria-describedby="error-description error-guide"
      >
        <!-- ==================================================
             LumiAロゴ
        ================================================== -->

        <a class="error-logo" href="./home.html" aria-label="LumiAホームへ戻る">
          <img
            src="../assets/images/icons/logo_main.png"
            alt="LumiA"
            class="error-logo__image"
          />
        </a>

        <!-- ==================================================
             エラー案内カード
        ================================================== -->

        <div class="error-card">
          <!-- ----------------------------------------------
               コーギくん
          ---------------------------------------------- -->

          <div class="error-mascot">
            <img
              src="../assets/images/characters/corgi_apology.png"
              alt="申し訳なさそうに案内するコーギくん"
              class="error-mascot__image"
            />
          </div>

          <!-- ----------------------------------------------
               エラーメッセージ
          ---------------------------------------------- -->

          <div class="error-message" aria-live="polite" aria-atomic="true">
            <!-- 英語の補助ラベル -->
            <p class="error-message__eyebrow">Something went wrong</p>

            <!-- エラータイトル -->
            <h1 class="error-message__title" id="error-title">
              うまく表示できなかったみたいです。
            </h1>

            <!-- エラーの説明 -->
            <p class="error-message__description" id="error-description">
              ごめんなさい。ただいま、ページを正しく表示できませんでした。
            </p>

            <!-- 次の行動への案内 -->
            <p class="error-message__guide" id="error-guide">
              通信環境を確認して、もう一度お試しください。
            </p>
          </div>

          <!-- ----------------------------------------------
               操作ボタン
          ---------------------------------------------- -->

          <div class="error-actions">
            <!-- 再試行・ログイン・ホームへの操作 -->
            <button
              type="button"
              class="error-actions__retry"
              id="error-retry"
              data-error-retry
            >
              <span>もう一度試す</span>

              <span class="error-actions__arrow" aria-hidden="true"> → </span>
            </button>

            <!-- ホームへ戻る -->
            <a href="./home.html" class="error-actions__home"> ホームへ戻る </a>
          </div>
        </div>

        <!-- ==================================================
             補足メッセージ
        ================================================== -->

        <p class="error-footer">
          問題が解決しない場合は、時間をおいて再度お試しください。
        </p>
      </section>
    </main>
  </body>
</html>
