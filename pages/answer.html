<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="津高技専用AI学校アシスタント LumiA" />
    <meta name="theme-color" content="#f6e9cf" />

    <title>回答 | LumiA</title>

    <!-- ファビコン -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/icons/favicon_master.png"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/answer.css" />

    <!-- 共通JavaScript -->
    <script src="../js/common.js" defer></script>
    <script src="../js/error-handler.js" defer></script>

    <!-- 回答画面JavaScript -->
    <script type="module" src="../js/answer.js"></script>
  </head>

  <body class="answer-page">
    <main class="answer-screen">
      <div class="answer-screen__background" aria-hidden="true"></div>

      <!-- 共通ナビゲーション -->
      <nav class="lumia-nav" aria-label="メインナビゲーション">
        <a class="lumia-nav__link" href="./about.html"> LumiAについて </a>

        <a class="lumia-nav__link" href="./faq.html"> よくある質問 </a>

        <a class="lumia-nav__link" href="./history.html"> 質問履歴 </a>

        <a class="lumia-nav__link lumia-nav__link--future" href="./howto.html">
          使い方
        </a>
      </nav>

      <!-- ヘッダー -->
      <header class="answer-header">
        <!-- LumiAロゴ -->
        <a
          class="answer-header__logo"
          href="./home.html"
          aria-label="LumiA ホームへ戻る"
        >
          <img src="../assets/images/icons/logo_compact.png" alt="LumiA" />
        </a>

        <!-- ホーム画面へ戻るしおりボタン -->
        <button
          class="answer-header__home"
          type="button"
          id="home-button"
          aria-label="ホームへ戻る"
        >
          <svg
            class="answer-header__home-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M3 10.5L12 3L21 10.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.5 9.5V20H18.5V9.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M9.5 20V14H14.5V20"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>

          <span>ホーム</span>
        </button>
      </header>

      <!-- 回答エリア -->
      <section class="answer-content" aria-label="LumiAの回答">
        <div class="answer-book">
          <div class="answer-book__spread" id="answer-spread">
            <!-- 左ページ：質問・追加質問 -->
            <article class="answer-book__page answer-book__page--left">
              <div class="answer-book__page-content">
                <p class="answer-book__eyebrow">あなたの質問</p>

                <h1 class="answer-question" id="answer-question">
                  質問がここに表示されます。
                </h1>
              </div>

              <div class="answer-book__left-footer">
                <section class="answer-question-area" aria-label="追加質問">
                  <p
                    class="answer-question-area__heading"
                    id="question-mode-label"
                  >
                    ほかの質問はありますか？
                  </p>

                  <form class="answer-input-form" id="answer-question-form">
                    <textarea
                      class="answer-input-form__input"
                      id="answer-question-input"
                      name="question"
                      rows="2"
                      placeholder="質問を入力..."
                      aria-labelledby="question-mode-label"
                      required
                    ></textarea>

                    <button
                      class="answer-input-form__submit"
                      type="submit"
                      aria-label="質問を送信"
                    >
                      <span>送信</span>
                      <span aria-hidden="true">→</span>
                    </button>
                  </form>

                  <!-- 質問履歴ボタン -->
                  <div class="answer-actions">
                    <button
                      type="button"
                      class="answer-actions__button"
                      id="history-button"
                    >
                      <svg
                        class="answer-actions__icon"
                        viewBox="0 0 32 32"
                        fill="none"
                        aria-hidden="true"
                      >
                        <path
                          d="M8 4.5H20C21.1 4.5 22 5.4 22 6.5V27L15 22.5L8 27V6.5C8 5.4 8.9 4.5 10 4.5Z"
                          fill="#FFF7E9"
                          stroke="#174875"
                          stroke-width="1.7"
                          stroke-linejoin="round"
                        />

                        <path
                          d="M11.5 9H18.5"
                          stroke="#B88743"
                          stroke-width="1.3"
                          stroke-linecap="round"
                        />

                        <circle
                          cx="22.5"
                          cy="20.5"
                          r="7"
                          fill="#F5E6C9"
                          stroke="#B88743"
                          stroke-width="1.5"
                        />

                        <path
                          d="M22.5 16.8V20.5L25 22"
                          stroke="#174875"
                          stroke-width="1.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />

                        <circle cx="22.5" cy="20.5" r="0.8" fill="#E99A43" />
                      </svg>

                      <span>これまでの質問</span>
                    </button>
                  </div>
                </section>
              </div>
            </article>

            <!-- 本の中央の綴じ目 -->
            <div class="answer-book__binding" aria-hidden="true"></div>

            <!-- 右ページ：LumiAの回答 -->
            <article class="answer-book__page answer-book__page--right">
              <div class="answer-book__page-content">
                <p class="answer-book__eyebrow">LumiAからの答え</p>

                <div
                  class="answer-body"
                  id="answer-body"
                  aria-live="polite"
                  aria-atomic="true"
                >
                  <p class="answer-body__placeholder">
                    ここにLumiAからの回答が表示されます。
                  </p>
                </div>

                <!-- 参考資料 -->
                <section
                  class="answer-references"
                  id="answer-references"
                  aria-label="参考資料"
                  hidden
                >
                  <h2 class="answer-references__title">参考資料</h2>

                  <ul
                    class="answer-references__list"
                    id="answer-references-list"
                  ></ul>
                </section>
              </div>

              <!-- コーギくん -->
              <img
                class="answer-book__mascot"
                src="../assets/images/characters/corgi_reading.png"
                alt=""
                aria-hidden="true"
              />
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
