<!--
==================================================
LumiA
ファイル名：answer.html

【ファイル概要】
ユーザーが入力した質問に対するLumiAの回答を表示するHTMLファイル。

【主な役割】
・質問内容を表示する
・LumiAの回答を表示する
・参照した学校情報を表示する
・追加質問を入力できるようにする
・回答生成中などの状態を表示する

【関連ファイル】
・css/common.css
・css/answer.css
・js/common.js
・js/answer.js
・js/question.js
・js/api.js

【注意】
学校情報に十分な根拠がない場合、
LumiAは推測で回答しない。
==================================================
-->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="津高技専用AI学校アシスタント LumiA" />
    <meta name="theme-color" content="#f6e9cf" />

    <title>回答 | LumiA</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/icons/favicon_master.png"
    />

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/answer.css" />

    <script type="module" src="../js/answer.js"></script>
  </head>

  <body class="answer-page">
    <main class="answer-screen">
      <!-- 背景 -->
      <div class="answer-screen__background" aria-hidden="true"></div>

      <!-- ヘッダー -->
      <header class="answer-header">
        <a
          class="answer-header__logo"
          href="./home.html"
          aria-label="LumiA ホームへ戻る"
        >
          <img src="../assets/images/icons/logo_compact.png" alt="LumiA" />
        </a>

        <button class="answer-header__home" type="button" id="home-button">
          ホーム
        </button>
      </header>

      <!-- 回答エリア -->
      <section class="answer-content" aria-label="LumiAの回答">
        <div class="answer-book">
          <!-- 本の見出し -->
          <div class="answer-book__heading">
            <span>YOUR LEARNING BOOK</span>
          </div>

          <!-- 見開きページ -->
          <div class="answer-book__spread" id="answer-spread">
            <!-- 左ページ：質問 -->
            <article class="answer-book__page answer-book__page--left">
              <div class="answer-book__page-content">
                <p class="answer-book__eyebrow">あなたの問い</p>

                <h1 class="answer-question" id="answer-question">
                  質問がここに表示されます。
                </h1>

                <div
                  class="answer-book__page-decoration"
                  aria-hidden="true"
                ></div>
              </div>

              <span class="answer-book__page-number"> PAGE 01 </span>
            </article>

            <!-- 本の中央 -->
            <div class="answer-book__binding" aria-hidden="true"></div>

            <!-- 右ページ：回答 -->
            <article class="answer-book__page answer-book__page--right">
              <div class="answer-book__page-content">
                <p class="answer-book__eyebrow">LumiAからの答え</p>

                <!-- 回答本文 -->
                <div class="answer-body" id="answer-body" aria-live="polite">
                  <p class="answer-body__placeholder">
                    ここにLumiAからの回答が書き込まれていきます。
                  </p>
                </div>

                <!-- 参考資料 -->
                <section
                  class="answer-references"
                  id="answer-references"
                  aria-label="参考資料"
                  hidden
                >
                  <h2 class="answer-references__title">参考資料</h2>

                  <ul
                    class="answer-references__list"
                    id="answer-references-list"
                  ></ul>
                </section>
              </div>

              <span class="answer-book__page-number"> PAGE 02 </span>
            </article>
          </div>

          <!-- ページ操作 -->
          <nav class="answer-book__navigation" aria-label="回答ページの操作">
            <button type="button" id="previous-page" disabled>
              前のページ
            </button>

            <span id="page-indicator"> 1 / 1 </span>

            <button type="button" id="next-page" disabled>次のページ</button>
          </nav>
        </div>

        <!-- 質問操作エリア -->
        <section class="answer-question-area" aria-label="次の質問">
          <p class="answer-question-area__heading" id="question-mode-label">
            この続きを知りたいですか？
          </p>

          <form class="answer-input-form" id="answer-question-form">
            <textarea
              class="answer-input-form__input"
              id="answer-question-input"
              name="question"
              rows="2"
              placeholder="追加質問を入力..."
              required
            ></textarea>

            <button
              class="answer-input-form__submit"
              type="submit"
              aria-label="質問を送信"
            >
              <span>送信</span>
              <span aria-hidden="true">→</span>
            </button>
          </form>

          <!-- 質問モード切り替え -->
          <div class="answer-actions">
            <button
              type="button"
              class="answer-actions__button"
              id="new-question-button"
            >
              <span aria-hidden="true">＋</span>
              別のことを質問する
            </button>

            <button
              type="button"
              class="answer-actions__button"
              id="history-button"
            >
              <span aria-hidden="true">▤</span>
              これまでの質問
            </button>
          </div>
        </section>
      </section>

      <!-- コーギくん -->
      <img
        class="answer-mascot"
        src="../assets/images/characters/corgi_idea.png"
        alt=""
        aria-hidden="true"
      />
    </main>
  </body>
</html>
