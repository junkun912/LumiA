<!--
==================================================
LumiA
ファイル名：answer.html

【ファイル概要】
ユーザーが入力した質問と、
LumiAからの回答を表示するHTMLファイル。

【主な役割】
・質問内容を表示する
・LumiAの回答を表示する
・回答の参考資料を表示する
・追加質問を入力する
・質問履歴へ移動する

【関連ファイル】
・css/common.css
・css/answer.css
・js/common.js
・js/answer.js
・js/question.js
・js/api.js

【注意】
学校情報に十分な根拠がない場合、
LumiAは推測で回答しない。
==================================================
-->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="津高技専用AI学校アシスタント LumiA" />
    <meta name="theme-color" content="#f6e9cf" />

    <title>回答 | LumiA</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/images/icons/favicon_master.png"
    />

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/answer.css" />

    <script type="module" src="../js/answer.js"></script>
  </head>

  <body class="answer-page">
    <main class="answer-screen">
      <!-- 背景 -->
      <div class="answer-screen__background" aria-hidden="true"></div>

      <!-- ヘッダー -->
      <header class="answer-header">
        <!-- LumiAロゴ -->
        <a
          class="answer-header__logo"
          href="./home.html"
          aria-label="LumiA ホームへ戻る"
        >
          <img src="../assets/images/icons/logo_compact.png" alt="LumiA" />
        </a>

        <!-- ホームボタン -->
        <button
          class="answer-header__home"
          type="button"
          id="home-button"
          aria-label="ホームへ戻る"
        >
          <svg
            class="answer-header__home-icon"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M3 10.5L12 3L21 10.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M5.5 9.5V20H18.5V9.5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />

            <path
              d="M9.5 20V14H14.5V20"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linejoin="round"
            />
          </svg>

          <span>ホーム</span>
        </button>
      </header>

      <!-- 回答エリア -->
      <section class="answer-content" aria-label="LumiAの回答">
        <div class="answer-book">
          <!-- 見開きページ -->
          <div class="answer-book__spread" id="answer-spread">
            <!-- ==================================
                 左ページ：質問・追加質問
            ================================== -->
            <article class="answer-book__page answer-book__page--left">
              <!-- 質問表示エリア -->
              <div class="answer-book__page-content">
                <p class="answer-book__eyebrow">あなたの質問</p>

                <h1 class="answer-question" id="answer-question">
                  質問がここに表示されます。
                </h1>
              </div>

              <!-- 左ページ下部 -->
              <div class="answer-book__left-footer">
                <!-- 追加質問エリア -->
                <section class="answer-question-area" aria-label="追加質問">
                  <p
                    class="answer-question-area__heading"
                    id="question-mode-label"
                  >
                    ほかの質問はありますか？
                  </p>

                  <!-- 追加質問フォーム -->
                  <form class="answer-input-form" id="answer-question-form">
                    <textarea
                      class="answer-input-form__input"
                      id="answer-question-input"
                      name="question"
                      rows="2"
                      placeholder="質問を入力..."
                      required
                    ></textarea>

                    <button
                      class="answer-input-form__submit"
                      type="submit"
                      aria-label="質問を送信"
                    >
                      <span>送信</span>
                      <span aria-hidden="true">→</span>
                    </button>
                  </form>

                  <!-- 質問履歴 -->
                  <div class="answer-actions">
                    <button
                      type="button"
                      class="answer-actions__button"
                      id="history-button"
                    >
                      <span aria-hidden="true">▤</span>
                      これまでの質問
                    </button>
                  </div>
                </section>
              </div>
            </article>

            <!-- 本の中央の綴じ目 -->
            <div class="answer-book__binding" aria-hidden="true"></div>

            <!-- ==================================
                 右ページ：LumiAの回答
            ================================== -->
            <article class="answer-book__page answer-book__page--right">
              <div class="answer-book__page-content">
                <!-- 回答見出し -->
                <p class="answer-book__eyebrow">LumiAからの答え</p>

                <!-- 回答本文 -->
                <div
                  class="answer-body"
                  id="answer-body"
                  aria-live="polite"
                  aria-atomic="true"
                >
                  <p class="answer-body__placeholder">
                    ここにLumiAからの回答が表示されます。
                  </p>
                </div>

                <!-- 参考資料 -->
                <section
                  class="answer-references"
                  id="answer-references"
                  aria-label="参考資料"
                  hidden
                >
                  <h2 class="answer-references__title">参考資料</h2>

                  <ul
                    class="answer-references__list"
                    id="answer-references-list"
                  ></ul>
                </section>
              </div>

              <!-- 回答状態に応じて画像を切り替えるコーギくん -->
              <img
                class="answer-book__mascot"
                src="../assets/images/characters/corgi_reading.png"
                alt=""
                aria-hidden="true"
              />
            </article>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
